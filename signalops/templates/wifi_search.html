    <script>
        /* ==== CHAT POPUP LOGIC ==== */
        const fabBtn = document.getElementById('chat-fab');
        const modal = document.getElementById('chat-modal');
        const closeBtn = document.getElementById('close-chat');
        const input = document.getElementById('chat-input');
        const sendBtn = document.getElementById('chat-send');
        const messages = document.getElementById('chat-messages');

        // Conversation history kept in memory — persists for the session
        let chatHistory = [];

        function openChat() { modal.classList.add('open'); input.focus(); }
        function closeChat() { modal.classList.remove('open'); input.value = ''; }
        fabBtn.addEventListener('click', openChat);
        closeBtn.addEventListener('click', closeChat);
        modal.addEventListener('click', e => { if (e.target === modal) closeChat(); });

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            if (type === 'bot' && text === 'typing') {
                div.innerHTML = `<span class="typing"></span><span class="typing"></span><span class="typing"></span>`;
            } else if (type === 'bot') {
                // Basic markdown: bold, code, line breaks
                const html = String(text)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                    .replace(/`([^`]+)`/g, '<code style="background:rgba(139,92,246,0.15);padding:1px 5px;border-radius:3px;font-size:11px">$1</code>')
                    .replace(/\n/g, '<br>');
                div.innerHTML = html;
            } else {
                div.textContent = text;
            }
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        // Build map context from current scan state (if available globally)
        function buildMapContext() {
            try {
                // These globals are set by the map scan code
                if (typeof window.lastScanDevices === 'undefined') return {};
                const devices = window.lastScanDevices || [];
                const ctx = { total: devices.length };
                const loc = window.lastScanCoords;
                if (loc) ctx.location = `${loc.lat.toFixed(4)}, ${loc.lon.toFixed(4)}`;
                devices.forEach(d => {
                    const t = d.type || 'unknown';
                    if (t === 'router')      ctx.wifi     = (ctx.wifi||0) + 1;
                    else if (t === 'camera') ctx.camera   = (ctx.camera||0) + 1;
                    else if (t === 'cell_tower') ctx.cell = (ctx.cell||0) + 1;
                    else if (t === 'drone' || t === 'aircraft') ctx.drone = (ctx.drone||0) + 1;
                    else if (t === 'bluetooth' || t === 'ble') ctx.bt = (ctx.bt||0) + 1;
                    else                     ctx.iot      = (ctx.iot||0) + 1;
                    if ((d.risk || 0) >= 70) ctx.high_risk = (ctx.high_risk||0) + 1;
                    if (d.wpasec_hit)        ctx.cracked   = (ctx.cracked||0) + 1;
                });
                return ctx;
            } catch(e) { return {}; }
        }

        /* ==== SEND MESSAGE → FLASK /api/chat ==== */
        async function sendMessage() {
            const userText = input.value.trim();
            if (!userText) return;

            addMessage(userText, 'user');
            input.value = '';
            sendBtn.disabled = true;

            // Add to history as user turn
            chatHistory.push({ role: 'user', content: userText });

            // Show typing indicator
            addMessage('typing', 'bot');

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: userText,
                        history: chatHistory.slice(-14),   // last 7 exchanges
                        map_context: buildMapContext()
                    })
                });
                const data = await res.json();
                const reply = data.reply || (data.error ? '' + data.error : 'Yanıt alınamadı.');

                messages.lastElementChild.remove(); // remove typing
                addMessage(reply, 'bot');

                // Add bot reply to history
                chatHistory.push({ role: 'model', content: reply });

                // Keep history bounded to 30 turns
                if (chatHistory.length > 30) chatHistory = chatHistory.slice(-30);

            } catch (err) {
                messages.lastElementChild.remove();
                addMessage('Bağlantı hatası — tekrar dene.', 'bot');
                console.error(err);
                // Remove the failed user message from history
                chatHistory.pop();
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) sendMessage(); });

        /* Close with ESC */
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && modal.classList.contains('open')) closeChat();
        });

        /* ==== RESPONSIVE: layer panel toggle + map resize ==== */
        (function () {
            var hdr = document.querySelector('#layer-panel .layer-panel-hdr');
            if (hdr) hdr.addEventListener('click', function () {
                document.getElementById('layer-panel').classList.toggle('expanded');
            });
            var t = null;
            function fixMap() {
                clearTimeout(t);
                t = setTimeout(function () {
                    try { if (typeof map !== 'undefined' && map && map.invalidateSize) map.invalidateSize(); } catch (e) {}
                }, 150);
            }
            window.addEventListener('resize', fixMap);
            window.addEventListener('orientationchange', fixMap);
            window.addEventListener('load', fixMap);
        })();
